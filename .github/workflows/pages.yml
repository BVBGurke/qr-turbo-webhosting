name: Build and deploy QR Turbo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages_check.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run test && npm run build && npm run test:dist
      - name: Check whether GitHub Pages is configured
        id: pages_check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' --header "Authorization: Bearer ${GH_TOKEN}" --header 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          if [ "$code" = '200' ]; then echo 'enabled=true' >> "$GITHUB_OUTPUT"; else echo 'enabled=false' >> "$GITHUB_OUTPUT"; echo 'GitHub Pages is not enabled. Configure Settings > Pages > GitHub Actions.'; fi
      - uses: actions/configure-pages@v5
        if: steps.pages_check.outputs.enabled == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages_check.outputs.enabled == 'true'
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
