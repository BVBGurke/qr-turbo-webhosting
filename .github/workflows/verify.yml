name: Verify QR Turbo
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript source
        run: npm run test
      - name: Build static website
        run: npm run build
      - name: Verify generated video routes
        run: npm run test:dist
