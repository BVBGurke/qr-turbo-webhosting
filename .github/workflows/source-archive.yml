name: Source ZIP archive
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Create complete repository ZIP
        run: git archive --format=zip --prefix=qr-turbo-webhosting/ --output=qr-turbo-webhosting.zip HEAD
      - name: Upload downloadable source archive
        uses: actions/upload-artifact@v4
        with:
          name: qr-turbo-webhosting-source
          path: qr-turbo-webhosting.zip
          retention-days: 30
          if-no-files-found: error
